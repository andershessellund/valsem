name: PR title

# main takes squash merges only, and the PR title becomes the commit on main —
# the line release-please reads to choose the version bump and write the
# changelog. So the title is what must be a Conventional Commit:
#   fix: …   feat: …   feat!: …   docs: / ci: / chore: / refactor: / test: / perf: / build:
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
