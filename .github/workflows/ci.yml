name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the runtime floor (`engines`): Set.prototype.union & co.
        # `latest` is where native Temporal ships unflagged, so the
        # `valsem/temporal` suites run against the real thing there, and
        # against temporal-polyfill on 22. Nothing may skip on either: with
        # CI set, vitest.config.ts fails the run on a skipped test.
        node: [22, latest]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  # What the suite cannot see, because it imports from src/: the package as it
  # is PUBLISHED, and the docs site. A typo in the `exports` map, a `types`
  # path that is not packed, or a guide page that no longer builds all pass
  # every test, and surface only in a release or in the deploy on main.
  package:
    name: package and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest # as docs.yml: the docs demo imports the compiled dist
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # publint lints the packed tarball (exports, types, files, sideEffects);
      # attw resolves every entry point the way consumers' TypeScript does.
      # `esm-only` sets aside the CommonJS and node10 columns: there is no
      # CommonJS build, by design (docs/guide/requirements.md).
      - run: pnpm check:package
      - run: pnpm docs:build
